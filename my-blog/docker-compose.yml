services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog
    # Портів назовні немає навмисно: база доступна лише всередині
    # docker-мережі за іменем `postgres:5432`. Так її не видно
    # ні з хоста, ні з інтернету.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blog']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # alpine-варіант: ~15 МБ проти ~150 МБ у повного образу.
    # Для Redis це особливо доречно — усередині лише один бінарник.
    image: redis:7-alpine
    # Портів назовні немає з тієї ж причини, що й у postgres:
    # у Redis за замовчуванням НЕМАЄ пароля, тож відкритий порт —
    # це відкритий доступ до всіх даних кешу.
    expose:
      - '6379'
    # maxmemory + політика витіснення: коли кеш упреться в ліміт,
    # Redis сам викине найдавніше використані ключі, а не почне
    # відмовляти в записі.
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ''
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./my-express-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://postgres:password@postgres:5432/blog?schema=public'
      REDIS_URL: 'redis://redis:6379'
      PORT: 5050
      JWT_SECRET: 'super-secret-key-change-this'
    # Перед стартом накатуємо міграції: у свіжому томі база порожня,
    # і без цього кроку всі запити падали б у 500.
    command: sh -c "npx prisma migrate deploy && npm start"
    ports:
      - '5050:5050'

  frontend:
    build:
      context: ./my-blog-frontend
      args:
        # NEXT_PUBLIC_* змінні Next.js вшиває в бандл під час білду,
        # тому передаємо їх саме як build-arg, а не як runtime env.
        # Відносний шлях `/api` працює і на http, і на https —
        # запит іде на той самий origin, тобто в nginx.
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    ports:
      - '3000:3000'

  nginx:
    build: ./nginx
    environment:
      # true — origin приймає запити ТІЛЬКИ з мереж Cloudflare.
      # Вмикати лише коли домен уже проксується через Cloudflare
      # (класична схема з DNS), інакше відріже і тебе самого.
      # УВАГА: у режимі Cloudflare Tunnel має лишатись false —
      # cloudflared приходить із docker-мережі, а не з мереж Cloudflare.
      CLOUDFLARE_ONLY: 'false'
      # Додаткові довірені мережі для відновлення IP клієнта.
      # Для тунелю розкоментуй docker-підмережу:
      # EXTRA_REAL_IP_RANGES: '172.16.0.0/12'
      EXTRA_REAL_IP_RANGES: ''
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Сертифікати живуть у томі: self-signed генерується при першому
      # старті. Щоб підкласти справжній — заміни цей рядок на
      # `- ./nginx/certs:/etc/nginx/certs:ro` і поклади туди
      # server.crt та server.key.
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend

  # Cloudflare Tunnel — з'єднує локальний стек з мережею Cloudflare
  # вихідним підключенням, тобто без публічного IP і без відкритих
  # портів на роутері. Саме те, що треба, щоб показати проєкт світу
  # з ноутбука або підняти його за NAT.
  #
  # Не стартує зі звичайним `docker compose up` — тільки явно:
  #   docker compose --profile cloudflare up -d
  #
  # Токен береться з файлу .env у корені (див. .env.example).
  # Створити тунель і отримати токен треба у себе в панелі
  # Cloudflare: Zero Trust → Networks → Tunnels.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['cloudflare']
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Порожнє значення за замовчуванням — інакше Compose лається
      # на відсутню змінну навіть коли профіль cloudflare не активний
      # (підстановка змінних відбувається до фільтрації профілів).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx

volumes:
  pgdata:
  nginx-certs:
