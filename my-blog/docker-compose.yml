version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./my-express-app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/blog?schema=public"
      PORT: 5050
      JWT_SECRET: "super-secret-key-change-this"
    ports:
      - "5050:5050"

  frontend:
    build: ./my-blog-frontend
    depends_on:
      - backend
    environment:
      # Вказуємо фронтенду, де лежить API
      # Під час білду і SSR він буде звертатись через контейнер
      NEXT_PUBLIC_API_URL: http://localhost:80/api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata: