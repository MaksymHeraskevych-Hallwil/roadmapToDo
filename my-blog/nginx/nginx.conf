events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Стискаємо статику і json — менше трафіку, швидше вантажиться
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # Відновлення справжнього IP клієнта з-за Cloudflare.
    # Файл генерується при старті контейнера скриптом 05-cloudflare.sh.
    # ВАЖЛИВО: цей include має йти ДО limit_req_zone нижче — інакше
    # ліміти рахувались би на IP серверів Cloudflare, тобто один
    # зловмисник блокував би всіх, хто зайшов через ту саму точку.
    include /etc/nginx/cf-realip.conf;

    # Пишемо в лог справжній IP і країну, яку підставляє Cloudflare
    log_format  cf  '$remote_addr - $http_cf_ipcountry [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  cf;

    # ── Обмеження частоти запитів ──────────────────────────────────
    # Це «друга лінія» після Cloudflare: WAF на краю мережі не рятує
    # від того, хто знайшов IP origin і б'є напряму.
    #
    # 10m пам'яті вистачає приблизно на 160 тисяч унікальних IP.
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/s;
    limit_req_status 429;

    # Не більше 20 одночасних з'єднань з одного IP
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_conn_status 429;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:5050;
    }

    # Спільні заголовки для проксі — щоб бекенд бачив реального клієнта.
    # $scheme тут буде http або https залежно від того, куди прийшов запит.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── HTTP (80): тільки редірект на HTTPS ──────────────────────────────
    server {
        listen 80;
        server_name _;

        # Місце під ACME-челендж, якщо колись будеш випускати
        # справжній сертифікат через Let's Encrypt / certbot.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (443): основний сервер ─────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Сертифікати: або підкладені з хоста, або self-signed,
        # згенеровані скриптом 10-generate-self-signed-cert.sh
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Кажемо браузеру рік ходити сюди тільки по https
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;

        client_max_body_size 10M;

        # Режим «тільки Cloudflare» — генерується скриптом залежно від
        # змінної CLOUDFLARE_ONLY. За замовчуванням файл порожній.
        include /etc/nginx/cf-allow.conf;

        limit_conn conn 20;

        # ── Вхід і реєстрація: найласіші роути для перебору ─────────
        # 5 запитів на хвилину, плюс запас у 3 на випадок, коли людина
        # чесно помилилась паролем кілька разів поспіль.
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
        }

        location = /api/auth/register {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
        }

        # Статика Next.js — імена файлів містять хеш білду,
        # тому її можна кешувати «назавжди».
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Файли з public/ (іконки, svg тощо)
        location /static/ {
            proxy_pass http://frontend;
            add_header Cache-Control "public, max-age=86400";
        }

        # Запити до API відправляємо на бекенд.
        # burst=60 — короткі сплески (сторінка тягне кілька ресурсів
        # одразу) пропускаємо, стабільне перевищення ріжемо.
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
        }

        # Всі інші запити йдуть на фронтенд
        location / {
            proxy_pass http://frontend;

            # Потрібно для hot-reload у dev-режимі Next.js
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
